<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelAI - Smart Itinerary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <style>
        /* Ẩn thanh cuộn */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Hiệu ứng kéo thả */
        .sortable-ghost { opacity: 0.3; background-color: #e0f2fe; border: 2px dashed #3b82f6; border-radius: 0.75rem; }
        .sortable-drag { cursor: grabbing !important; transform: scale(1.02); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .day-ghost { opacity: 0.5; background: #f8fafc; border: 2px dashed #94a3b8; }

        /* Vùng thả trống (Empty drop zone) */
        .itinerary-list { min-height: 60px; transition: background 0.2s; }
        .itinerary-list:empty::after {
            content: "Kéo thả hoạt động vào đây...";
            display: flex;
            align-items: center;
            justify-center: center;
            height: 100%;
            color: #94a3b8;
            font-size: 0.875rem;
            font-style: italic;
            padding: 1rem;
            text-align: center;
        }
        
        /* Chuyển View (SPA) */
        .view-section { display: none; animation: fadeIn 0.2s ease-out; }
        .view-section.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        
        /* Bottom sheet (Vuốt từ dưới lên) */
        .bottom-sheet { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); transform: translateY(100%); }
        .bottom-sheet.open { transform: translateY(0); }
        .sheet-overlay { display: none; background: rgba(0,0,0,0.4); opacity: 0; transition: opacity 0.3s; }
        .sheet-overlay.open { display: block; opacity: 1; }
    </style>
</head>
<body class="bg-gray-800 h-screen flex items-center justify-center font-sans overflow-hidden">

    <div class="w-full max-w-[414px] h-[896px] bg-gray-50 rounded-[3rem] shadow-2xl relative overflow-hidden border-[12px] border-black flex flex-col">
        
        <div class="absolute top-0 inset-x-0 h-6 bg-black rounded-b-3xl w-1/2 mx-auto z-50"></div>

        <div id="view-login" class="view-section active flex-col h-full justify-center px-8 bg-white z-10">
            <div class="text-center mb-10">
                <div class="w-20 h-20 bg-blue-600 rounded-3xl mx-auto flex items-center justify-center rotate-12 shadow-lg mb-6">
                    <i class="fa-solid fa-plane-departure text-white text-4xl -rotate-12"></i>
                </div>
                <h1 class="text-4xl font-black text-gray-900 tracking-tight">TravelAI</h1>
                <p class="text-gray-500 mt-2 text-sm">Lên lịch trình thông minh trong tích tắc</p>
            </div>
            <div class="space-y-4">
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="email" placeholder="Email đăng nhập" class="w-full pl-12 pr-4 py-4 rounded-2xl bg-gray-50 border-transparent focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition">
                </div>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="password" placeholder="Mật khẩu" class="w-full pl-12 pr-4 py-4 rounded-2xl bg-gray-50 border-transparent focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition">
                </div>
                <button onclick="switchView('view-itinerary')" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-xl shadow-blue-200 hover:bg-blue-700 active:scale-95 transition mt-4">Đăng Nhập</button>
            </div>
            <div class="mt-8 text-center text-sm font-medium">
                <span class="text-gray-500">Chưa có tài khoản?</span>
                <button onclick="switchView('view-register')" class="text-blue-600 hover:underline ml-1">Đăng ký</button>
            </div>
        </div>

        <div id="view-register" class="view-section flex-col h-full justify-center px-8 bg-white z-10">
            <h1 class="text-3xl font-black text-gray-900 mb-2">Tạo tài khoản</h1>
            <p class="text-gray-500 text-sm mb-8">Tham gia cộng đồng đam mê du lịch</p>
            <div class="space-y-4">
                <input type="text" placeholder="Họ và tên" class="w-full px-5 py-4 rounded-2xl bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-200 transition">
                <input type="email" placeholder="Email" class="w-full px-5 py-4 rounded-2xl bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-200 transition">
                <input type="password" placeholder="Mật khẩu" class="w-full px-5 py-4 rounded-2xl bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-200 transition">
                <button onclick="switchView('view-itinerary')" class="w-full bg-gray-900 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition mt-4">Đăng Ký Ngay</button>
            </div>
            <button onclick="switchView('view-login')" class="mt-6 text-gray-500 text-sm font-medium hover:text-gray-900"><i class="fa-solid fa-arrow-left mr-2"></i>Quay lại đăng nhập</button>
        </div>

        <div id="view-profile" class="view-section flex-col h-full bg-gray-50 pb-24 overflow-y-auto no-scrollbar relative">
            <div class="bg-blue-600 px-6 pt-16 pb-20 rounded-b-[3rem] relative">
                <h2 class="text-2xl font-bold text-white text-center">Hồ sơ của tôi</h2>
            </div>
            <div class="px-6 -mt-14 relative z-10">
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex flex-col items-center">
                    <div class="relative">
                        <img src="https://i.pravatar.cc/150?img=11" class="w-28 h-28 rounded-full border-4 border-white shadow-md object-cover">
                        <button class="absolute bottom-0 right-0 w-8 h-8 bg-blue-600 rounded-full text-white text-xs shadow hover:bg-blue-700 flex items-center justify-center">
                            <i class="fa-solid fa-camera"></i>
                        </button>
                    </div>
                    <h3 class="text-xl font-black text-gray-800 mt-4">Nguyễn Tuấn Hưng</h3>
                    <p class="text-blue-500 font-medium text-sm">hunghn@gmail.com</p>
                </div>

                <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 mt-6 space-y-4">
                    <h4 class="font-bold text-gray-900 mb-2">Cập nhật thông tin</h4>
                    <div>
                        <label class="text-xs text-gray-500 font-bold ml-2">Số điện thoại</label>
                        <input type="text" value="0912 345 678" class="w-full px-4 py-3 mt-1 rounded-xl bg-gray-50 border border-gray-200">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 font-bold ml-2">Địa chỉ hiện tại</label>
                        <input type="text" value="Quận 1, TP. HCM" class="w-full px-4 py-3 mt-1 rounded-xl bg-gray-50 border border-gray-200">
                    </div>
                    <hr class="my-4 border-gray-100">
                    <div>
                        <label class="text-xs text-gray-500 font-bold ml-2">Đổi mật khẩu mới</label>
                        <input type="password" placeholder="Nhập mật khẩu mới..." class="w-full px-4 py-3 mt-1 rounded-xl bg-gray-50 border border-gray-200">
                    </div>
                    <button class="w-full bg-gray-900 text-white font-bold py-4 rounded-xl active:scale-95 transition mt-4">Lưu Cập Nhật</button>
                </div>
                
                <button onclick="switchView('view-login')" class="w-full bg-red-50 text-red-600 font-bold py-4 rounded-2xl mt-6 shadow-sm flex items-center justify-center gap-2 active:scale-95 transition">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Đăng xuất
                </button>
            </div>
        </div>


        <div id="view-itinerary" class="view-section flex-col h-full bg-[#f4f7fb] pb-24 relative">
            
            <div class="bg-white px-6 pt-14 pb-5 shadow-sm z-10 flex justify-between items-start rounded-b-3xl">
                <div>
                    <span class="bg-blue-100 text-blue-700 text-[10px] font-black px-2 py-1 rounded uppercase tracking-wider">Đang lên lịch</span>
                    <h2 class="text-2xl font-black text-gray-900 mt-2 leading-tight">Khám phá Đà Lạt<br>Mùa Sương Mù</h2>
                    <p class="text-sm text-gray-500 mt-1"><i class="fa-regular fa-calendar mr-1"></i> 25/12 - 27/12 (3 Ngày)</p>
                </div>
                <div class="flex gap-2">
                    <button class="w-10 h-10 bg-gray-50 rounded-full flex items-center justify-center text-gray-600 hover:bg-gray-100"><i class="fa-solid fa-users"></i></button>
                </div>
            </div>

            <div id="days-container" class="flex-1 overflow-y-auto no-scrollbar p-5 space-y-6">
                </div>

            <div class="px-5 pb-5">
                <button onclick="addNewDay()" class="w-full border-2 border-dashed border-blue-300 bg-blue-50 text-blue-600 font-bold py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-95 transition">
                    <i class="fa-solid fa-plus"></i> Thêm Ngày Mới
                </button>
            </div>
        </div>


        <div id="overlay" class="sheet-overlay absolute inset-0 z-40" onclick="closeAllSheets()"></div>

        <div id="sheet-places" class="bottom-sheet absolute inset-x-0 bottom-0 h-[85%] bg-white rounded-t-[2.5rem] shadow-2xl z-50 flex flex-col">
            <div class="w-full flex justify-center py-4 cursor-pointer" onclick="closeAllSheets()">
                <div class="w-12 h-1.5 bg-gray-300 rounded-full"></div>
            </div>
            
            <div class="px-6 pb-2">
                <h3 class="font-black text-xl text-gray-900">Thêm Địa Điểm</h3>
                <div class="relative mt-4">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="search-place" oninput="filterPlaces()" placeholder="Tìm quán cafe, nhà hàng..." class="w-full pl-12 pr-4 py-3 bg-gray-100 rounded-xl focus:outline-none">
                </div>
                
                <div class="flex gap-2 mt-4 overflow-x-auto no-scrollbar pb-2" id="category-filters">
                    <button onclick="setCategoryFilter('all')" class="cat-btn bg-gray-900 text-white px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap transition">Tất cả</button>
                    <button onclick="setCategoryFilter('Cafe')" class="cat-btn bg-gray-100 text-gray-600 px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap transition">☕ Cafe</button>
                    <button onclick="setCategoryFilter('Food')" class="cat-btn bg-gray-100 text-gray-600 px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap transition">🍜 Ăn uống</button>
                    <button onclick="setCategoryFilter('Checkin')" class="cat-btn bg-gray-100 text-gray-600 px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap transition">📸 Check-in</button>
                </div>
            </div>

            <div id="places-list" class="flex-1 overflow-y-auto no-scrollbar px-6 py-4 space-y-4"></div>
        </div>

        <div id="sheet-edit-item" class="bottom-sheet absolute inset-x-0 bottom-0 h-auto pb-8 bg-white rounded-t-[2.5rem] shadow-2xl z-50 flex flex-col">
            <div class="w-full flex justify-center py-4 cursor-pointer" onclick="closeAllSheets()">
                <div class="w-12 h-1.5 bg-gray-300 rounded-full"></div>
            </div>
            <div class="px-6">
                <h3 class="font-black text-xl text-gray-900 mb-6">Chỉnh sửa HĐ</h3>
                
                <label class="text-xs text-gray-500 font-bold">Giờ bắt đầu</label>
                <input type="time" id="edit-time" class="w-full px-4 py-3 mt-1 mb-4 rounded-xl bg-gray-50 border border-gray-200">
                
                <label class="text-xs text-gray-500 font-bold">Ghi chú (Note)</label>
                <textarea id="edit-note" rows="3" placeholder="Ví dụ: Nhớ mặc áo ấm, book bàn trước..." class="w-full px-4 py-3 mt-1 rounded-xl bg-gray-50 border border-gray-200"></textarea>
                
                <button onclick="saveItemEdit()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl mt-6 active:scale-95 transition">Lưu Thay Đổi</button>
            </div>
        </div>


        <div class="absolute bottom-0 w-full bg-white/90 backdrop-blur-md border-t border-gray-100 px-8 py-5 flex justify-between items-center z-30 pb-8">
            <button onclick="switchView('view-itinerary')" class="nav-btn text-blue-600 flex flex-col items-center transition">
                <i class="fa-solid fa-calendar-check text-2xl"></i>
            </button>
            <button class="nav-btn text-gray-300 hover:text-gray-900 flex flex-col items-center transition">
                <i class="fa-solid fa-compass text-2xl"></i>
            </button>
            <button class="nav-btn text-gray-300 hover:text-gray-900 flex flex-col items-center transition">
                <i class="fa-solid fa-heart text-2xl"></i>
            </button>
            <button onclick="switchView('view-profile')" class="nav-btn text-gray-300 hover:text-gray-900 flex flex-col items-center transition">
                <i class="fa-solid fa-user-astronaut text-2xl"></i>
            </button>
        </div>

    </div>

    <script>
        // ------------------------------
        // 1. DATA GIẢ LẬP (MOCK DATA)
        // ------------------------------
        const dbPlaces = [
            { id: 'p1', name: 'Tiệm Cà Phê Túi Mơ To', type: 'Cafe', desc: 'View thung lũng đèn cực chill', img: 'https://images.unsplash.com/photo-1554118811-1e0d58224f24?w=200&h=200&fit=crop' },
            { id: 'p2', name: 'Lẩu Gà Lá É Tao Ngộ', type: 'Food', desc: 'Đặc sản Đà Lạt, 250k/nồi', img: 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=200&h=200&fit=crop' },
            { id: 'p3', name: 'Đỉnh Langbiang', type: 'Checkin', desc: 'Ngắm toàn cảnh mây núi', img: 'https://images.unsplash.com/photo-1629806899797-2f1eb8259160?w=200&h=200&fit=crop' },
            { id: 'p4', name: 'An Café', type: 'Cafe', desc: 'Quán cafe mộc mạc bên sườn dốc', img: 'https://images.unsplash.com/photo-1497935586351-b67a49e012bf?w=200&h=200&fit=crop' },
            { id: 'p5', name: 'Chợ Đêm Đà Lạt', type: 'Checkin', desc: 'Ăn vặt, mua sắm đồ len', img: 'https://images.unsplash.com/photo-1506012787146-f92b2d7d6d96?w=200&h=200&fit=crop' }
        ];

        let dayCounter = 2; // Bắt đầu đã có 2 ngày

        // ------------------------------
        // 2. CHUYỂN ĐỔI VIEW & NAVBAR
        // ------------------------------
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            
            // Đổi màu nút Nav
            if(viewId === 'view-itinerary' || viewId === 'view-profile') {
                const btns = document.querySelectorAll('.nav-btn');
                btns.forEach(btn => {
                    btn.classList.remove('text-blue-600');
                    btn.classList.add('text-gray-300');
                });
                if(viewId === 'view-itinerary') {
                    btns[0].classList.add('text-blue-600');
                    btns[0].classList.remove('text-gray-300');
                } else {
                    btns[3].classList.add('text-blue-600');
                    btns[3].classList.remove('text-gray-300');
                }
            }
        }

        // ------------------------------
        // 3. LOGIC KÉO THẢ (SORTABLE JS)
        // ------------------------------
        let daySortable;
        
        function initSortable() {
            // 3.1 Kéo thả Đổi vị trí Ngày (Day block)
            const daysContainer = document.getElementById('days-container');
            if(daySortable) daySortable.destroy(); // Xóa config cũ nếu có
            
            daySortable = new Sortable(daysContainer, {
                animation: 250,
                handle: '.day-drag-handle', // Nắm vào Header ngày để kéo
                ghostClass: 'day-ghost'
            });

            // 3.2 Kéo thả Item xuyên Ngày (Cross-list Drag & Drop)
            document.querySelectorAll('.itinerary-list').forEach(list => {
                // Hủy Sortable cũ trên list này trước khi gán mới (tránh duplicate event)
                if (list._sortable) list._sortable.destroy();
                
                list._sortable = new Sortable(list, {
                    group: 'shared-items', // Chìa khóa để kéo xuyên sang danh sách ngày khác
                    animation: 200,
                    handle: '.item-drag-handle', // Nắm vào icon grip để kéo
                    ghostClass: 'sortable-ghost',
                    easing: "cubic-bezier(1, 0, 0, 1)"
                });
            });
        }

        // ------------------------------
        // 4. CRUD: QUẢN LÝ NGÀY (DAY)
        // ------------------------------
        function addNewDay() {
            dayCounter++;
            const dayId = `day-${dayCounter}`;
            const html = `
                <div class="day-card bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden relative">
                    <button onclick="deleteDay(this)" class="absolute top-4 right-16 w-8 h-8 text-red-400 bg-red-50 rounded-full hover:bg-red-100 flex items-center justify-center z-10 transition">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                    <button onclick="openPlaceSheet('${dayId}')" class="absolute top-4 right-4 w-8 h-8 bg-gray-900 text-white rounded-full flex items-center justify-center z-10 active:scale-90 transition shadow-md">
                        <i class="fa-solid fa-plus text-xs"></i>
                    </button>
                    
                    <div class="day-drag-handle bg-gray-50 px-5 py-4 cursor-grab border-b border-gray-100 flex items-center">
                        <i class="fa-solid fa-grip-vertical text-gray-300 mr-3 text-lg"></i>
                        <div>
                            <h3 class="font-black text-gray-800 text-lg">Ngày ${dayCounter}</h3>
                            <p class="text-xs text-gray-500 font-medium">Chưa có hoạt động</p>
                        </div>
                    </div>
                    
                    <div id="${dayId}" class="itinerary-list p-3 space-y-2"></div>
                </div>
            `;
            document.getElementById('days-container').insertAdjacentHTML('beforeend', html);
            initSortable(); // Khởi tạo lại chức năng kéo thả cho list mới
        }

        function deleteDay(btnElement) {
            if(confirm("Bạn có chắc muốn xóa toàn bộ ngày này không?")) {
                btnElement.closest('.day-card').remove();
            }
        }

        // ------------------------------
        // 5. CRUD: QUẢN LÝ ĐỊA ĐIỂM (ITEM)
        // ------------------------------
        let targetDayIdForAdd = null; // Biến lưu lại xem đang ấn Thêm ở Ngày nào
        
        // Mở danh sách chọn
        function openPlaceSheet(dayId) {
            targetDayIdForAdd = dayId;
            document.getElementById('overlay').classList.add('open');
            document.getElementById('sheet-places').classList.add('open');
            renderPlaces('all'); // Render lại toàn bộ chỗ
        }

        function closeAllSheets() {
            document.querySelectorAll('.bottom-sheet').forEach(el => el.classList.remove('open'));
            document.getElementById('overlay').classList.remove('open');
            activeItemToEdit = null;
        }

        // Logic Lọc Category
        let currentFilter = 'all';
        function setCategoryFilter(cat) {
            currentFilter = cat;
            // Đổi màu nút
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn bg-gray-100 text-gray-600 px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap transition";
            });
            event.target.className = "cat-btn bg-gray-900 text-white px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap transition shadow-md";
            
            filterPlaces();
        }

        function filterPlaces() {
            const keyword = document.getElementById('search-place').value.toLowerCase();
            renderPlaces(currentFilter, keyword);
        }

        function renderPlaces(filterCat, keyword = '') {
            const container = document.getElementById('places-list');
            container.innerHTML = '';
            
            dbPlaces.forEach(p => {
                if(filterCat !== 'all' && p.type !== filterCat) return;
                if(keyword && !p.name.toLowerCase().includes(keyword)) return;
                
                // Color mapping cho category
                const colorMap = { 'Cafe': 'orange', 'Food': 'green', 'Checkin': 'blue' };
                const c = colorMap[p.type];

                const html = `
                    <div class="flex gap-4 items-center p-2 rounded-2xl hover:bg-gray-50 transition">
                        <img src="${p.img}" class="w-16 h-16 rounded-2xl object-cover shadow-sm">
                        <div class="flex-1">
                            <h4 class="font-bold text-gray-900 text-sm leading-tight">${p.name}</h4>
                            <p class="text-xs text-gray-500 mt-1 line-clamp-1">${p.desc}</p>
                            <span class="inline-block mt-1 text-[10px] font-bold text-${c}-600 bg-${c}-50 px-2 py-0.5 rounded uppercase">${p.type}</span>
                        </div>
                        <button onclick="addPlaceToDay('${p.name}', '${p.type}')" class="w-10 h-10 rounded-full bg-gray-100 text-gray-900 flex justify-center items-center active:bg-gray-900 active:text-white transition shadow-sm">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        // Logic Add Item vào Ngày
        function addPlaceToDay(name, type) {
            if (!targetDayIdForAdd) return;
            const listEl = document.getElementById(targetDayIdForAdd);
            
            const colorMap = { 'Cafe': 'bg-orange-100 text-orange-600', 'Food': 'bg-green-100 text-green-600', 'Checkin': 'bg-blue-100 text-blue-600' };
            const iconMap = { 'Cafe': 'fa-mug-hot', 'Food': 'fa-bowl-food', 'Checkin': 'fa-camera' };
            const theme = colorMap[type];
            const icon = iconMap[type];

            const html = `
                <div class="item-card bg-white border border-gray-100 p-3 rounded-2xl flex items-center gap-3 shadow-sm relative group">
                    <i class="fa-solid fa-grip-vertical text-gray-300 px-2 item-drag-handle cursor-grab active:cursor-grabbing text-lg"></i>
                    
                    <div class="w-12 h-12 ${theme} rounded-xl flex flex-col items-center justify-center flex-shrink-0 shadow-inner">
                        <span class="text-xs font-black time-label">09:00</span>
                        <i class="fa-solid ${icon} text-[10px] mt-0.5 opacity-80"></i>
                    </div>
                    
                    <div class="flex-1 cursor-pointer" onclick="openEditItem(this)">
                        <h4 class="font-bold text-gray-800 text-sm line-clamp-1 name-label">${name}</h4>
                        <p class="text-xs text-gray-400 mt-0.5 note-label italic"><i class="fa-solid fa-pen text-[10px] mr-1"></i> Bấm để sửa note</p>
                    </div>

                    <button onclick="deleteItem(this)" class="w-8 h-8 rounded-full bg-red-50 text-red-400 flex items-center justify-center active:scale-90">
                        <i class="fa-solid fa-xmark text-sm"></i>
                    </button>
                </div>
            `;
            listEl.insertAdjacentHTML('beforeend', html);
            
            // Báo thành công và Update UI Header của Ngày
            updateDayHeaderCount(targetDayIdForAdd);
            closeAllSheets();
        }

        function deleteItem(btnEl) {
            const dayId = btnEl.closest('.itinerary-list').id;
            btnEl.closest('.item-card').remove();
            updateDayHeaderCount(dayId);
        }

        // Logic Update (Sửa Time và Note)
        let activeItemToEdit = null;

        function openEditItem(clickArea) {
            activeItemToEdit = clickArea.closest('.item-card');
            
            // Lấy dữ liệu hiện tại nhét vào form
            const currentTime = activeItemToEdit.querySelector('.time-label').innerText;
            const currentNote = activeItemToEdit.querySelector('.note-label').innerText;
            
            document.getElementById('edit-time').value = currentTime;
            document.getElementById('edit-note').value = currentNote.includes("Bấm để sửa") ? "" : currentNote;

            document.getElementById('overlay').classList.add('open');
            document.getElementById('sheet-edit-item').classList.add('open');
        }

        function saveItemEdit() {
            if(!activeItemToEdit) return;
            const newTime = document.getElementById('edit-time').value;
            const newNote = document.getElementById('edit-note').value;

            if(newTime) activeItemToEdit.querySelector('.time-label').innerText = newTime;
            
            const noteEl = activeItemToEdit.querySelector('.note-label');
            if(newNote.trim() !== "") {
                noteEl.innerHTML = `<span class="text-blue-500 font-semibold">${newNote}</span>`;
                noteEl.classList.remove('italic');
            } else {
                noteEl.innerHTML = `<i class="fa-solid fa-pen text-[10px] mr-1"></i> Bấm để sửa note`;
                noteEl.classList.add('italic');
            }
            
            closeAllSheets();
        }

        // Tiện ích đếm số hoạt động
        function updateDayHeaderCount(dayId) {
            const list = document.getElementById(dayId);
            const count = list.children.length;
            const headerText = list.previousElementSibling.querySelector('p');
            headerText.innerText = count > 0 ? `${count} hoạt động` : `Chưa có hoạt động`;
        }

        // Khởi tạo Layout mặc định ban đầu
        function initInitialDays() {
            // Giả lập đã có Ngày 1
            const day1Html = `
                <div class="day-card bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden relative">
                    <button onclick="deleteDay(this)" class="absolute top-4 right-16 w-8 h-8 text-red-400 bg-red-50 rounded-full flex items-center justify-center z-10 transition">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                    <button onclick="openPlaceSheet('day-1')" class="absolute top-4 right-4 w-8 h-8 bg-gray-900 text-white rounded-full flex items-center justify-center z-10 active:scale-90 transition shadow-md">
                        <i class="fa-solid fa-plus text-xs"></i>
                    </button>
                    <div class="day-drag-handle bg-gray-50 px-5 py-4 cursor-grab border-b border-gray-100 flex items-center">
                        <i class="fa-solid fa-grip-vertical text-gray-300 mr-3 text-lg"></i>
                        <div>
                            <h3 class="font-black text-gray-800 text-lg">Ngày 1</h3>
                            <p class="text-xs text-gray-500 font-medium">1 hoạt động</p>
                        </div>
                    </div>
                    <div id="day-1" class="itinerary-list p-3 space-y-2">
                        <div class="item-card bg-white border border-gray-100 p-3 rounded-2xl flex items-center gap-3 shadow-sm relative group">
                            <i class="fa-solid fa-grip-vertical text-gray-300 px-2 item-drag-handle cursor-grab text-lg"></i>
                            <div class="w-12 h-12 bg-gray-900 text-white rounded-xl flex flex-col items-center justify-center flex-shrink-0 shadow-inner">
                                <span class="text-xs font-black time-label">08:00</span>
                                <i class="fa-solid fa-plane-arrival text-[10px] mt-0.5 opacity-80"></i>
                            </div>
                            <div class="flex-1 cursor-pointer" onclick="openEditItem(this)">
                                <h4 class="font-bold text-gray-800 text-sm line-clamp-1 name-label">Sân bay Liên Khương</h4>
                                <p class="text-xs text-gray-400 mt-0.5 note-label italic"><i class="fa-solid fa-pen text-[10px] mr-1"></i> Bấm để sửa note</p>
                            </div>
                            <button onclick="deleteItem(this)" class="w-8 h-8 rounded-full bg-red-50 text-red-400 flex items-center justify-center active:scale-90">
                                <i class="fa-solid fa-xmark text-sm"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('days-container').innerHTML = day1Html;
            initSortable(); // Kích hoạt chức năng kéo thả
        }

        // Chạy khi load trang
        window.onload = () => {
            initInitialDays();
        };

    </script>
</body>
</html>
